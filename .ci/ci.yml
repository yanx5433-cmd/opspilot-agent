name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest + ruff + eval（${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      PYTHONUTF8: "1"
      # 明确不设 Key：证明"无 API Key 全功能可用"不是口号
      LLM_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装开发依赖（运行时核心必须保持零依赖）
        run: python -m pip install -r requirements-dev.txt

      - name: 断言核心零第三方依赖
        run: |
          python - <<'PY'
          import subprocess, sys
          out = subprocess.run([sys.executable, "-c",
              "import sys, app.agent.executor, app.tools, app.algos;"
              "bad=[m for m in sys.modules if m.split('.')[0] in "
              "{'fastapi','uvicorn','pydantic','httpx','requests','numpy','pandas','langchain','openai'}];"
              "print('核心导入链上的第三方模块:', bad or '无');sys.exit(1 if bad else 0)"],
              capture_output=True, text=True)
          print(out.stdout.strip() or out.stderr.strip())
          sys.exit(out.returncode)
          PY

      - name: 生成确定性演示数据
        run: python scripts/seed_demo.py

      - name: 单元测试（离线，无网络）
        run: python -m pytest -q

      - name: 静态检查
        run: python -m ruff check app tests evals scripts

      - name: 离线评测（门禁 95%）
        run: python -m app.cli eval --fail-under 0.95

      - name: CLI 冒烟：一次真实诊断
        run: |
          python -m app.cli run "db-01 为什么一直在重启，帮我排查根因" -v
          python -m app.cli tools
          python -m app.cli data

      - name: 留档评测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ matrix.python-version }}
          path: evals/reports/
          if-no-files-found: ignore
